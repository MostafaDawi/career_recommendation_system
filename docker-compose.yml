services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - backend_pgdata:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"

  qdrant:
    image: qdrant/qdrant
    restart: always
    ports:
      - "6333:6333"
    volumes:
      - backend_qdrant_data:/qdrant/storage

  api_gateway:
    build: ./backend/api_gateway
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./backend/api_gateway:/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

  user_service:
    build: ./backend/user_service
    restart: always
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql+asyncpg://user:password@postgres:5432/user_service_db
    ports:
      - "8001:8001"
    volumes:
      - ./backend/user_service:/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8001"]

  recommendation_service:
    build: ./backend/recommendation_service
    restart: always
    depends_on:
      - embedding_service
      - vectordb_service
    ports:
      - "8002:8002"
    volumes:
      - ./backend/recommendation_service:/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8002"]

  embedding_service:
    build: ./backend/embedding_service
    restart: always
    ports:
      - "8003:8003"
    volumes:
      - ./backend/embedding_service:/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8003"]

  job_service:
    build: ./backend/job_service
    restart: always
    depends_on:
      - postgres
      - embedding_service
    environment:
      DATABASE_URL: postgresql+asyncpg://user:password@postgres:5432/job_service_db
    ports:
      - "8004:8004"
    volumes:
      - ./backend/job_service:/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8004"]

  vectordb_service:
    build: ./backend/vectordb_service
    restart: always
    ports:
      - "8005:8005"
    volumes:
      - ./backend/vectordb_service:/app
    depends_on:
      - qdrant

  chatbot_service:
    build: ./backend/chatbot
    restart: always
    ports:
      - "8006:8006"
    volumes:
      - ./backend/chatbot:/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8006"]

volumes:
  backend_pgdata:
    external: True
  backend_qdrant_data:
    external: True
